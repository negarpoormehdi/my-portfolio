<nav class="navbar">
  <div class="navbar__container">

    <!-- Logo -->
    <a routerLink="/" class="navbar__logo">Negar Poormehdi's Portfolio</a>

    <!-- Nav links -->
    <ul class="navbar__links">
      <li *ngFor="let link of navLinks">
        <a
          [routerLink]="link.route"
          [fragment]="link.fragment"
          [class.navbar__link--active]="isActive(link)"
          class="navbar__link"
        >{{ link.label }}</a>
      </li>
    </ul>

    <!-- Right side: theme toggle + CTA -->
    <div class="navbar__actions">

      <!-- Dark / Light toggle -->
      <button
        class="navbar__theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
      >
        <!-- Sun icon (shown in dark mode → click to go light) -->
        <svg *ngIf="theme.theme() === 'dark'"
          class="navbar__theme-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>

        <!-- Moon icon (shown in light mode → click to go dark) -->
        <svg *ngIf="theme.theme() === 'light'"
          class="navbar__theme-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Download CV -->
      <a
        href="/negarpoormehdiCV.pdf"
        download="Negar_Poormehdi_CV.pdf"
        class="navbar__cta navbar__cta--ghost"
        title="Download CV"
        aria-label="Download CV"
      >
        <span class="mat-icon navbar__cta-icon">description</span>
        <span class="navbar__cta-label">CV</span>
      </a>

      <!-- Download Portfolio -->
      <a
        href="/negar-poormehdi-portfolio.pdf"
        download="Negar_Poormehdi_Portfolio.pdf"
        class="navbar__cta navbar__cta--filled"
        title="Download Portfolio"
        aria-label="Download Portfolio"
      >
        <span class="mat-icon navbar__cta-icon">download</span>
        <span class="navbar__cta-label">Portfolio</span>
      </a>
    </div>

  </div>
</nav>
