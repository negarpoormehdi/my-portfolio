<nav class="navbar">
  <div class="navbar__container">

    <!-- Logo -->
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">Negar's Portfolio</a>

    <!-- Nav links (desktop) -->
    <ul class="navbar__links">
      <li *ngFor="let link of navLinks">
        <a
          [routerLink]="link.route"
          [fragment]="link.fragment"
          [class.navbar__link--active]="isActive(link)"
          class="navbar__link"
        >{{ link.label }}</a>
      </li>
    </ul>

    <!-- Right side: theme toggle + CTA (desktop) + hamburger (mobile) -->
    <div class="navbar__actions">

      <!-- Dark / Light toggle — always visible -->
      <button
        class="navbar__theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
      >
        <svg *ngIf="theme.theme() === 'dark'"
          class="navbar__theme-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg *ngIf="theme.theme() === 'light'"
          class="navbar__theme-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Download buttons — hidden on mobile, shown in drawer instead -->
      <a
        href="/negarpoormehdiCV.pdf"
        download="Negar_Poormehdi_CV.pdf"
        class="navbar__cta navbar__cta--ghost navbar__cta--desktop"
        title="Download CV"
        aria-label="Download CV"
      >
        <span class="mat-icon navbar__cta-icon">description</span>
        <span class="navbar__cta-label">CV</span>
      </a>

      <a
        href="/negar-poormehdi-portfolio.pdf"
        download="Negar_Poormehdi_Portfolio.pdf"
        class="navbar__cta navbar__cta--filled navbar__cta--desktop"
        title="Download Portfolio"
        aria-label="Download Portfolio"
      >
        <span class="mat-icon navbar__cta-icon">download</span>
        <span class="navbar__cta-label">Portfolio</span>
      </a>

      <!-- Hamburger — mobile only -->
      <button
        class="navbar__hamburger"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="mat-icon">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>

    </div>
  </div>

  <!-- Mobile drawer -->
  <div class="navbar__drawer" [class.navbar__drawer--open]="menuOpen()">
    <ul class="navbar__drawer-links">
      <li *ngFor="let link of navLinks">
        <a
          [routerLink]="link.route"
          [fragment]="link.fragment"
          [class.navbar__drawer-link--active]="isActive(link)"
          class="navbar__drawer-link"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      </li>
    </ul>

    <div class="navbar__drawer-actions">
      <a
        href="/negarpoormehdiCV.pdf"
        download="Negar_Poormehdi_CV.pdf"
        class="navbar__cta navbar__cta--ghost"
        (click)="closeMenu()"
      >
        <span class="mat-icon navbar__cta-icon">description</span>
        <span class="navbar__cta-label">Download CV</span>
      </a>
      <a
        href="/negar-poormehdi-portfolio.pdf"
        download="Negar_Poormehdi_Portfolio.pdf"
        class="navbar__cta navbar__cta--filled"
        (click)="closeMenu()"
      >
        <span class="mat-icon navbar__cta-icon">download</span>
        <span class="navbar__cta-label">Download Portfolio</span>
      </a>
    </div>
  </div>

  <!-- Backdrop -->
  <div
    class="navbar__backdrop"
    [class.navbar__backdrop--visible]="menuOpen()"
    (click)="closeMenu()"
  ></div>

</nav>
