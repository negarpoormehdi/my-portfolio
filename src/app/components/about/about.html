<section class="about" id="about" [class.about--visible]="sectionVisible()">

  <!-- ── Header ── -->
  <div class="about__header">
    <div class="about__header-text">
      <span class="about__badge">ABOUT ME</span>
      <h2 class="about__title">
        From <span class="about__title-accent">Biology</span>
        to <span class="about__title-accent2">Code</span>
      </h2>
      <p class="about__subtitle">
        An unexpected journey anatomy books, robot arms,
        and late-night debugging sessions that changed everything.
      </p>
    </div>

    <!-- Stats -->
    <div class="about__stats">
      <div class="about__stat">
        <span class="about__stat-num">3+</span>
        <span class="about__stat-label">Years Coding</span>
      </div>
      <div class="about__stat-divider"></div>
      <div class="about__stat">
        <span class="about__stat-num">10+</span>
        <span class="about__stat-label">Apps Shipped</span>
      </div>
      <div class="about__stat-divider"></div>
      <div class="about__stat">
        <span class="about__stat-num">∞</span>
        <span class="about__stat-label">Curiosity</span>
      </div>
    </div>
  </div>

  <!-- ── Character image commented until decision ──
  <div class="about__char-col">
    <div class="about__char-img-wrap">
      <img
        src="character.png"
        alt="Negar Poormehdi"
        class="about__char-img"
      />
      <div class="about__char-glow"></div>
    </div>
  </div>
  ── end of commented block ── -->

  <!-- ── Interactive Journey Map (full width) ── -->
  <div class="about__map-wrap">
    <app-journey-map />
  </div>

</section>
