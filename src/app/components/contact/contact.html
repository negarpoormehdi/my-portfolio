<section class="contact" id="contact">
  <div class="contact__outer">

    <!-- Main card -->
    <div class="contact__card" [class.contact__card--visible]="headerVisible()">

      <!-- Glow -->
      <div class="contact__glow contact__glow--tl"></div>
      <div class="contact__glow contact__glow--br"></div>

      <!-- Header -->
      <div class="contact__header" id="contact-header">
        <span class="contact__badge">AVAILABLE FOR WORK</span>

        <h2 class="contact__title">
          Let's Build Something<br>
          <span class="contact__title-accent">
            {{ displayedWord() }}<span
              class="contact__cursor"
              [class.contact__cursor--hidden]="!showCursor()"
            >|</span>
          </span>
        </h2>

        <p class="contact__subtitle">
          Currently looking for new opportunities and interesting collaborations.<br>
          Feel free to reach out!
        </p>
      </div>

      <!-- Contact cards row -->
      <div class="contact__links">
        <a
          *ngFor="let card of contactCards; let i = index"
          [href]="card.href"
          class="contact__link-card"
          [class.contact__link-card--visible]="isCardVisible(i)"
          [style.transition-delay]="(i * 100) + 'ms'"
          target="_blank"
          rel="noopener"
          #contactCard
        >
          <!-- Icon -->
          <div class="contact__link-icon">
            <!-- Email -->
            <svg *ngIf="card.icon === 'email'" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
            <!-- LinkedIn -->
            <svg *ngIf="card.icon === 'linkedin'" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="2" y="2" width="20" height="20" rx="4"/>
              <line x1="8" y1="10" x2="8" y2="16"/>
              <line x1="8" y1="7" x2="8" y2="7.5" stroke-width="2.5"/>
              <path d="M12 10v6M12 13a3 3 0 0 1 6 0v3"/>
            </svg>
            <!-- GitHub -->
            <svg *ngIf="card.icon === 'github'" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
          </div>

          <span class="contact__link-label">{{ card.label }}</span>
          <span class="contact__link-action">{{ card.action }}</span>

          <!-- Hover shine -->
          <div class="contact__link-shine"></div>
        </a>
      </div>

    </div><!-- /contact__card -->

      <!-- Response time -->
      <p class="contact__response">Average response time: &lt; 24 hours</p>

  </div>
</section>
