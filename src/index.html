<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Negar Poormehdi Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Sora (Headline) + Inter (Body & Label) -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body>
  <!-- Prevent theme flash: apply saved theme before Angular boots -->
  <script>
    (function() {
      var saved = localStorage.getItem('lp-theme');
      var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
